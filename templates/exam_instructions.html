<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exam Instructions</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        .instructions-container {
            max-width: 800px;
            width: 90%;
            margin: 2rem auto;
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-lg);
            box-shadow: var(--shadow-lg);
            padding: 2.5rem;
        }
        .instructions-header {
            text-align: center;
            margin-bottom: 2rem;
            border-bottom: 2px solid var(--primary-border);
            padding-bottom: 1.5rem;
        }
        .instructions-header h1 {
            font-size: 2rem;
            margin-bottom: 0.5rem;
            color: var(--primary-color);
            font-weight: 600;
        }
        .instructions-header p {
            color: var(--text-muted);
            font-size: 1rem;
        }
        .acknowledgement-box {
            margin-top: 2rem;
            padding: 1.5rem;
            background-color: var(--primary-light);
            border: 1px solid var(--primary-border);
            border-radius: var(--radius-md);
            display: flex;
            align-items: flex-start;
            gap: 12px;
            text-align: left;
        }
        .acknowledgement-box input[type="checkbox"] {
            margin-top: 4px;
            width: 18px;
            height: 18px;
            cursor: pointer;
            accent-color: var(--primary-color);
        }
        .acknowledgement-box label {
            font-size: 0.95rem;
            color: var(--text-color);
            cursor: pointer;
            line-height: 1.4;
            user-select: none;
        }
        .action-group {
            margin-top: 2rem;
            display: flex;
            justify-content: center;
            gap: 1rem;
        }
        .continue-btn {
            background-color: var(--primary-color);
            color: #ffffff;
            border: none;
            padding: 0.75rem 2rem;
            font-size: 1rem;
            font-weight: 600;
            border-radius: var(--radius-md);
            cursor: pointer;
            transition: all var(--transition-fast);
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }
        .continue-btn:hover:not(:disabled) {
            background-color: var(--primary-hover);
            transform: translateY(-1px);
        }
        .continue-btn:disabled {
            background-color: var(--text-light);
            opacity: 0.6;
            cursor: not-allowed;
        }
    </style>
</head>
<body>

<div class="auth-wrapper" style="align-items: flex-start; overflow-y: auto; padding: 2rem 0; min-height: 100vh; display: flex; justify-content: center;">
    <div class="instructions-container">
        <div class="instructions-header">
            <h1><i class="fa-solid fa-book-bookmark" style="margin-right: 12px; color: var(--primary-color);"></i>Exam Instructions</h1>
            <p>Please review and acknowledge the examination rules and guidelines below before proceeding.</p>
        </div>

        {% include 'instructions_content.html' %}

        <form id="acknowledgementForm" method="POST" action="{{ url_for('start_exam') }}">
            <div class="acknowledgement-box">
                <input type="checkbox" id="acknowledgeCheckbox" name="acknowledged">
                <label for="acknowledgeCheckbox">
                    I have read and understood the examination instructions. I agree to abide by all the rules and guidelines detailed above.
                </label>
            </div>

            <div class="action-group">
                <button type="submit" id="continueBtn" class="continue-btn" disabled>
                    <i class="fa-solid fa-play"></i>
                    Continue to Exam
                </button>
            </div>
        </form>
    </div>
</div>

<script>
    document.addEventListener("DOMContentLoaded", function() {
        const checkbox = document.getElementById("acknowledgeCheckbox");
        const continueBtn = document.getElementById("continueBtn");
        
        checkbox.addEventListener("change", function() {
            continueBtn.disabled = !this.checked;
        });
    });
</script>
</body>
</html>
