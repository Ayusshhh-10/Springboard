<head><link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}"></head>
<div class="login-container">
<center>
    <h1>ONLINE EXAMINATION PORTAL</h1>

    <h2>Welcome Back!</h2>

    <p>Sign in to continue your examination.</p>

    <form method="POST">

        <label for="email">Email Address</label>

        <input
            type="email"
            id="email"
            name="email"
            placeholder="Enter your email"
            required
        >

        <label for="password">Password</label>

        <input
            type="password"
            id="password"
            name="password"
            placeholder="Enter your password"
            required
        >

        <button
            type="submit"
            class="login-btn"
        >
            Login
        </button>

    </form>

    <div class="register-text">

        Don't have an account?

        <a href="/register">
            Register
        </a>

    </div>
    </center>

</div>
