<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>

<div class="auth-wrapper">
    <div class="login-container">
        <h1>ONLINE EXAMINATION PORTAL</h1>
        <h2>Welcome Back!</h2>
        <p>Sign in to continue your examination.</p>

        {% with messages = get_flashed_messages() %}
            {% if messages %}
                {% for message in messages %}
                    <div class="flash-message">
                        {{ message }}
                    </div>
                {% endfor %}
            {% endif %}
        {% endwith %}

        <form method="POST">
            <div class="form-group">
                <label for="email">Email Address</label>
                <input
                    type="email"
                    id="email"
                    name="email"
                    placeholder="Enter your email"
                    required
                >
            </div>

            <div class="form-group">
                <label for="password">Password</label>
                <div class="password-box">
                    <input
                        type="password"
                        id="password"
                        name="password"
                        placeholder="Enter your password"
                        required
                    >
                    <span class="toggle-password" onclick="togglePassword()">
                        <i id="password-eye" class="fa-regular fa-eye"></i>
                    </span>
                </div>
            </div>

            <button
                type="submit"
                class="login-btn"
            >
                <i class="fa-solid fa-right-to-bracket" style="margin-right: 8px;"></i>
                Login
            </button>
        </form>

        <div class="register-text">
            Don't have an account?
            <a href="/register">Register</a>
        </div>

        <hr style="margin:30px 0;">

        <p style="color:var(--text-muted); margin-bottom: 12px;">
            Administrator?
        </p>

        <a href="{{ url_for('admin_login') }}" class="admin-link">
            <i class="fa-solid fa-user-shield" style="margin-right: 8px;"></i>
            Admin Login
        </a>
    </div>
</div>

<script>
function togglePassword() {
    var password = document.getElementById("password");
    var eye = document.getElementById("password-eye");
    if (password.type === "password") {
        password.type = "text";
        eye.classList.remove("fa-eye");
        eye.classList.add("fa-eye-slash");
    } else {
        password.type = "password";
        eye.classList.remove("fa-eye-slash");
        eye.classList.add("fa-eye");
    }
}
</script>

</body>
</html>
